services: 
  db:
    platform: linux/amd64
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "default"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    platform: linux/amd64
    image: redis/redis-stack-server:7.2.0-v18
    restart: always

  twenty:
    platform: linux/amd64
    image: twenty
    build:
      dockerfile: ./Dockerfile
    environment:
      NODE_PORT: 3000
      ENCRYPTION_KEY: krakql-twenty-case-study-key
      PG_DATABASE_URL: postgres://postgres:postgres@db:5432/default
      REDIS_URL: redis://redis:6379
      SERVER_URL: http://localhost:3000
      STORAGE_TYPE: local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "http://localhost:3000/graphql",
        "-H", "Content-Type: application/json",
        "-d", "{\"query\":\"{ __typename }\"}"]
      start_period: 10m
    ports:
      - ":3000"
