services:
    
  fruits-api:
    platform: linux/amd64
    image: fruits-api
    build:
      dockerfile: ./Dockerfile
    ports:
      - ":9000"
    command: sh -c "npm run start"
    healthcheck:
      test: [
        "CMD", "curl", "-f", "-X", "POST", "http://localhost:9000/graphql",
        "-H", "content-type: application/json",
        "--data-raw", "{\"query\":\"{ __typename }\"}"
      ]
      interval: 30s
      start_period: 3m
      timeout: 10s
