schema {
  query: Query
  mutation: Mutation
}
"The `Upload` scalar type represents a file upload."
scalar Upload
type countries {
  country: String
}
type Fruit {
  id: ID
  scientific_name: String
  tree_name: String
  fruit_name: String
  family: String
  origin: String
  description: String
  bloom: String
  maturation_fruit: String
  life_cycle: String
  climatic_zone: String
  producing_countries: [countries]
}
type Query {
  fruit(id: ID!): Fruit
  fruits: [Fruit]
  filterFruitFam(family: String!): [Fruit]
  filterFruitOri(origin: String!): [Fruit]
}
type Mutation {
  addFruit(id: ID!, scientific_name: String!, tree_name: String!, fruit_name: String!, family: String!, origin: String!, description: String!, bloom: String!, maturation_fruit: String!, life_cycle: String!, climatic_zone: String!): Fruit!
  updateFruit(id: ID!, scientific_name: String!, tree_name: String!, fruit_name: String!, family: String!, origin: String!, description: String!, bloom: String!, maturation_fruit: String!, life_cycle: String!, climatic_zone: String!): Fruit!
  deleteFruit(id: ID!): Fruit!
}
enum CacheControlScope {
  PUBLIC
  PRIVATE
}
directive @cacheControl(maxAge: Int, scope: CacheControlScope) on FIELD_DEFINITION | OBJECT | INTERFACE
"Exposes a URL that specifies the behaviour of this scalar."
directive @specifiedBy(
    "The URL that specifies the behaviour of this scalar."
    url: String!
  ) on SCALAR
