services:
  redwoodjs-graphql:
    platform: linux/amd64
    image: redwood
    build:
      dockerfile: ./Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "http://127.0.0.1:8911/graphql",
        "-H", "Content-Type: application/json",
        "-d", "{\"query\":\"{ __typename }\"}"]
      interval: 30s
      start_period: 1m
      timeout: 10s
      retries: 3
    ports:
      - ":8910"
