

services:
  rxdb:
    platform: linux/amd64
    image: rxdb
    build:
      dockerfile: ./Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "http://localhost:10102/graphql",
        "-H", "Content-Type: application/json",
        "-d", "{\"query\":\"{ __typename }\"}"]
    ports:
      - ":10102"
   
    environment:
      - NODE_ENV=development
    restart: unless-stopped
