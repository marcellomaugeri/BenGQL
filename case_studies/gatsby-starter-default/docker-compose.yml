# version: '3.8'

services:
  gatsby-starter-default:
    platform: linux/amd64
    image: gatsby-starter-default
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ":9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "http://localhost:9000/___graphql",
        "-H", "Content-Type: application/json",
        "-d", "{\"query\":\"{ __typename }\"}"]
      interval: 30s
      start_period: 6m
      timeout: 10s
      retries: 3
